name: Deploy to GitHub Pages

on:
  push:
    branches: [main] # або master — який у тебе головний

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      # Secrets: Settings → Secrets and variables → Actions
      # Потрібні: PUBLIC_GOOGLE_SCRIPT_URL, PUBLIC_TELEGRAM_BOT_TOKEN, PUBLIC_TELEGRAM_CHAT_ID
      # Опційно: PUBLIC_GTM_ID, PUBLIC_ITCC_TRACK_ENDPOINT, PUBLIC_GOOGLE_ADS_SEND_TO_*
      - run: npm run build
        env:
          PUBLIC_GTM_ID: ${{ secrets.PUBLIC_GTM_ID != '' && secrets.PUBLIC_GTM_ID || 'GTM-MLSDNBJ4' }}
          PUBLIC_GOOGLE_SCRIPT_URL: ${{ secrets.PUBLIC_GOOGLE_SCRIPT_URL }}
          PUBLIC_TELEGRAM_BOT_TOKEN: ${{ secrets.PUBLIC_TELEGRAM_BOT_TOKEN }}
          PUBLIC_TELEGRAM_CHAT_ID: ${{ secrets.PUBLIC_TELEGRAM_CHAT_ID }}
          PUBLIC_ITCC_TRACK_ENDPOINT: ${{ secrets.PUBLIC_ITCC_TRACK_ENDPOINT }}
          PUBLIC_GOOGLE_ADS_SEND_TO_MAIN: ${{ secrets.PUBLIC_GOOGLE_ADS_SEND_TO_MAIN }}
          PUBLIC_GOOGLE_ADS_SEND_TO_ROBLOX: ${{ secrets.PUBLIC_GOOGLE_ADS_SEND_TO_ROBLOX != '' && secrets.PUBLIC_GOOGLE_ADS_SEND_TO_ROBLOX || 'AW-18135456615/SYizCPutn70cEOe21MdD' }}
          PUBLIC_GOOGLE_ADS_SEND_TO_FRONTEND: ${{ secrets.PUBLIC_GOOGLE_ADS_SEND_TO_FRONTEND }}
          PUBLIC_GOOGLE_ADS_SEND_TO_SCRATCH: ${{ secrets.PUBLIC_GOOGLE_ADS_SEND_TO_SCRATCH }}
          PUBLIC_GOOGLE_ADS_SEND_TO_MINECRAFT: ${{ secrets.PUBLIC_GOOGLE_ADS_SEND_TO_MINECRAFT }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

